name: Deploy training
on:
  push:
    branches: [training]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: training-${{ github.repository }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/training'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-southeast-5
      AWS_ACCOUNT: '925645278634'
      COMPONENT: fe
      IMAGE_COMPONENT: frontend
      INSTANCE_ID: i-09793bfa22239ca09
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::925645278634:role/govsuitedms-training-github-deploy
          aws-region: ap-southeast-5
      - uses: aws-actions/amazon-ecr-login@v2
        id: registry
      - name: Record model manifest
        id: model
        shell: bash
        run: |
          if [ "$IMAGE_COMPONENT" = inference ]; then
            printf 'sha=%s\n' "$(sha256sum models.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.registry }}/govsuitedms-training-${{ env.IMAGE_COMPONENT }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            govsuite.models-lock-sha256=${{ steps.model.outputs.sha }}
          build-args: |
            TEI_GPU_IMAGE=ghcr.io/huggingface/text-embeddings-inference:89-1.9@sha256:1a284d9ca1adcc20b78c261d4d052c06057f0a3cb49a15c5d2c00930f710fce2
      - name: Deploy approved component and wait for its result
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg instance "$INSTANCE_ID" --arg component "$COMPONENT" --arg tag "$IMAGE_TAG" --arg revision "$GITHUB_SHA" \
            '{InstanceIds:[$instance],DocumentName:"GovSuiteTrainingDeploy",Parameters:{Component:[$component],ImageTag:[$tag],Revision:[$revision]}}' > deployment-request.json
          command_id=$(aws ssm send-command --cli-input-json file://deployment-request.json --query Command.CommandId --output text)
          for attempt in $(seq 1 240); do
            if aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" > deployment-result.json 2>/dev/null; then
              status=$(jq -r .Status deployment-result.json)
              case "$status" in
                Success) jq '{Status,StandardOutputContent,StandardErrorContent}' deployment-result.json; exit 0 ;;
                Failed|TimedOut|Cancelled|Cancelling) jq '{Status,StandardOutputContent,StandardErrorContent}' deployment-result.json; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "SSM deployment did not complete within 40 minutes: $command_id" >&2
          exit 1
